# Auto-deploy the Cloudflare Worker API when worker/ or shared config changes.
# Pages frontend deploys via Cloudflare's Git integration (no Action needed).
#
# Required GitHub secret:
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts Edit + Account Read
# Optional:
#   CLOUDFLARE_ACCOUNT_ID — defaults to Corten account if set as variable

name: Deploy Worker API

on:
  push:
    branches: [master, main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Apply learning columns migration (idempotent best-effort)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute family-shop --remote --file=schema-learning.sql

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
