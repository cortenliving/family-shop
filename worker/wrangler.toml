name = "family-shop-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "family-shop"
database_id = "85789e16-873e-4185-a288-8e971c8eb38b"
preview_database_id = "85789e16-873e-4185-a288-8e971c8eb38b"

[durable_objects]
bindings = [
  { name = "FAMILY_ROOM", class_name = "FamilyRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyRoom"]

# Optional: serve API under same host as Pages via route
# routes = [{ pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }]

[vars]
APP_NAME = "FamilyShop"
